name: CI

on:
  push: {}
  pull_request: {}

# Add concurrency group to control job running
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    uses: Onemind-Services-LLC/actions/.github/workflows/netbox-plugin-tests.yml@d44af503e3f1bd61435617830a7c604c047dc408
    with:
      lint-runs-on: ci-small
      runs-on: ci-test
      plugin-name: 'netbox_metatype_importer'
      netbox-version: v4.6.1
      coverage-minimum: 45
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
