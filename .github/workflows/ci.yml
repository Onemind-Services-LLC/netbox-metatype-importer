name: CI

on:
  push: {}
  pull_request: {}

# Add concurrency group to control job running
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    uses: Onemind-Services-LLC/actions/.github/workflows/netbox-plugin-tests.yml@8ba8dea9401b08db920340ab52a47a0b3dd6e8d2
    with:
      plugin-name: 'netbox_metatype_importer'
      netbox-version: v4.6.1
      coverage-minimum: 45
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
